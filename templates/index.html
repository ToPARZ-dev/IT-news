<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical_url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical_url}}">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="{{assets_path}}favicon.svg">
<link rel="alternate" type="application/rss+xml" title="{{site_name}}" href="{{rss_path}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{assets_path}}style.css">
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>

<header class="masthead">
  <div class="wrap masthead-inner">
    <h1 class="brand"><a href="{{index_path}}">{{site_name}}</a></h1>
    <p class="masthead-tagline">{{tagline}}</p>
  </div>
</header>

<main id="main" class="wrap">
  <section class="hero">
    <p class="kicker">Latest issue</p>
    {{latest}}
  </section>

  <section class="archive">
    <h2 class="section-title">バックナンバー</h2>
    {{issues}}
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="policy">{{policy}}</p>
    <p class="colophon">© {{year}} {{publisher}} ・ <a href="{{rss_path}}">RSS</a></p>
  </div>
</footer>
</body>
</html>
